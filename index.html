<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>RVC — Credit Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --cover:#132318;
    --cover-2:#0d1a11;
    --paper:#F1E8D6;
    --paper-2:#E9DFC7;
    --ink:#221F1A;
    --ink-soft:#5B564A;
    --red:#A73B2E;
    --red-soft:#F1D9D3;
    --green:#3F6C4B;
    --green-soft:#DCE8DD;
    --gold:#AD8A3E;
    --rule:#C9BC9C;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--cover);
    background-image:
      radial-gradient(ellipse at 20% -10%, rgba(255,255,255,0.05), transparent 60%),
      repeating-linear-gradient(0deg, rgba(255,255,255,0.015) 0px, rgba(255,255,255,0.015) 1px, transparent 1px, transparent 3px);
    font-family:'Inter',sans-serif;
    color:var(--ink);
    min-height:100vh;
    padding-bottom:48px;
  }
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;}
  }

  /* ---------- Header ---------- */
  .cover{
    padding:34px 20px 26px;
    text-align:center;
    position:relative;
  }
  .cover::after{
    content:"";
    position:absolute; left:0; right:0; bottom:0;
    height:18px;
    background:
      radial-gradient(circle at 10px 0, transparent 9px, var(--cover-2) 9.5px) top/20px 18px repeat-x;
    opacity:0.55;
  }
  .eyebrow{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    letter-spacing:0.22em;
    text-transform:uppercase;
    color:#C9BE9F;
    margin:0 0 6px;
  }
  .brand{
    font-family:'Fraunces', serif;
    font-weight:700;
    font-size:30px;
    color:#F6EFDE;
    margin:0;
    letter-spacing:0.01em;
  }
  .brand-sub{
    font-family:'Fraunces', serif;
    font-style:italic;
    font-weight:500;
    font-size:14px;
    color:#B7AE8E;
    margin:4px 0 0;
  }

  /* ---------- Summary strip ---------- */
  .summary{
    margin:0 16px 20px;
    background:var(--paper);
    border-radius:14px;
    padding:18px 18px 16px;
    box-shadow:0 14px 30px -14px rgba(0,0,0,0.55);
    position:relative;
  }
  .summary-row{
    display:flex;
    justify-content:space-between;
    gap:10px;
  }
  .summary-item{flex:1; text-align:center;}
  .summary-label{
    font-family:'IBM Plex Mono', monospace;
    font-size:9.5px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--ink-soft);
    margin:0 0 4px;
  }
  .summary-value{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:19px;
    margin:0;
  }
  .summary-value.due{color:var(--red);}
  .summary-value.paid{color:var(--green);}
  .summary-divider{width:1px; background:var(--rule); margin:2px 0;}
  .summary-updated{
    text-align:center;
    font-size:10.5px;
    color:var(--ink-soft);
    margin-top:12px;
    font-family:'IBM Plex Mono', monospace;
  }

  /* ---------- Customer card ---------- */
  .cards{ padding:0 16px; display:flex; flex-direction:column; gap:16px; }
  .card{
    background:var(--paper);
    border-radius:4px 14px 14px 4px;
    position:relative;
    box-shadow:0 16px 34px -16px rgba(0,0,0,0.6);
    overflow:hidden;
  }
  .card::before{
    content:"";
    position:absolute; left:0; top:0; bottom:0; width:9px;
    background:var(--red);
    background-image:linear-gradient(rgba(0,0,0,0.12), rgba(0,0,0,0.12));
  }
  .card::after{
    content:"";
    position:absolute; left:26px; top:0; bottom:0; width:1px;
    background:rgba(167,59,46,0.35);
  }
  .card-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    padding:18px 16px 16px 34px;
    cursor:pointer;
    user-select:none;
  }
  .card-name{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:18px;
    margin:0 0 4px;
  }
  .card-meta{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    color:var(--ink-soft);
  }
  .stamp{
    font-family:'IBM Plex Mono', monospace;
    font-size:10.5px;
    font-weight:600;
    letter-spacing:0.09em;
    padding:5px 10px;
    border-radius:999px;
    border:1.5px solid var(--red);
    color:var(--red);
    transform:rotate(-4deg);
    white-space:nowrap;
    flex-shrink:0;
  }
  .stamp.clear{ border-color:var(--green); color:var(--green); }

  .card-totals{
    display:flex;
    padding:0 16px 16px 34px;
    gap:8px;
  }
  .pill{
    flex:1;
    background:var(--paper-2);
    border-radius:8px;
    padding:8px 10px;
    text-align:center;
  }
  .pill-label{ font-family:'IBM Plex Mono', monospace; font-size:8.5px; letter-spacing:0.06em; text-transform:uppercase; color:var(--ink-soft); margin:0 0 2px;}
  .pill-value{ font-family:'IBM Plex Mono', monospace; font-weight:600; font-size:13.5px; margin:0; }
  .pill-value.due{ color:var(--red); }

  .chevron{
    width:11px; height:11px;
    border-right:2px solid var(--ink-soft);
    border-bottom:2px solid var(--ink-soft);
    transform:rotate(45deg);
    transition:transform 0.25s ease;
    flex-shrink:0;
    margin-top:2px;
  }
  .card.open .chevron{ transform:rotate(-135deg); }

  .card-body{
    max-height:0;
    overflow:hidden;
    transition:max-height 0.35s ease;
  }
  .card.open .card-body{ max-height:2400px; }

  .txn{
    padding:14px 16px 14px 34px;
    border-top:1px dashed var(--rule);
  }
  .txn-top{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    gap:10px;
  }
  .txn-date{
    font-family:'IBM Plex Mono', monospace;
    font-size:10.5px;
    color:var(--ink-soft);
  }
  .txn-title{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:14.5px;
    margin:2px 0 0;
  }
  .txn-amt{
    font-family:'IBM Plex Mono', monospace;
    font-weight:600;
    font-size:15px;
    white-space:nowrap;
  }
  .txn-amt.bill{ color:var(--ink); }
  .txn-amt.payment{ color:var(--green); }
  .txn-bal{
    font-family:'IBM Plex Mono', monospace;
    font-size:10.5px;
    color:var(--ink-soft);
    margin-top:6px;
  }
  .items{
    margin:10px 0 0;
    padding:0;
    list-style:none;
    display:flex;
    flex-direction:column;
    gap:4px;
  }
  .items li{
    display:flex;
    justify-content:space-between;
    font-size:12.5px;
    color:var(--ink-soft);
    border-bottom:1px dotted var(--rule);
    padding-bottom:4px;
  }
  .items li span:first-child{ color:var(--ink); }
  .items .note{
    font-style:italic;
    font-size:11.5px;
    color:var(--ink-soft);
    border-bottom:none;
  }

  .footnote{
    text-align:center;
    color:#8f8768;
    font-family:'IBM Plex Mono', monospace;
    font-size:10.5px;
    margin:26px 20px 0;
    line-height:1.6;
  }
</style>
</head>
<body>

  <div class="cover">
    <p class="eyebrow">Royal Vegetable Commission</p>
    <h1 class="brand">RVC Credit Ledger</h1>
    <p class="brand-sub">who owes what, at a glance</p>
  </div>

  <div class="summary">
    <div class="summary-row">
      <div class="summary-item">
        <p class="summary-label">Billed</p>
        <p class="summary-value">₹10,460</p>
      </div>
      <div class="summary-divider"></div>
      <div class="summary-item">
        <p class="summary-label">Received</p>
        <p class="summary-value paid">₹0</p>
      </div>
      <div class="summary-divider"></div>
      <div class="summary-item">
        <p class="summary-label">Outstanding</p>
        <p class="summary-value due">₹10,460</p>
      </div>
    </div>
    <p class="summary-updated">as of 19 Aug 2026 · 1 customer on the books</p>
  </div>

  <div class="cards" id="cards"></div>

  <p class="footnote">Tap a name to open the account.<br>Send a new bill photo in chat and this page gets rebuilt.</p>

<script>
const data = [
  {
    "name": "SRS Hostels",
    "billed": 10460,
    "paid": 0,
    "due": 10460,
    "status": "pending",
    "txns": [
      {
        "title": "Bill",
        "type": "bill",
        "amount": 10460.0,
        "items": [
          [
            "Bendi (Okra)",
            "65 kg × 40 = 2600"
          ],
          [
            "Chikkudu (Flat beans)",
            "20 kg × 60 = 1200"
          ],
          [
            "Tomata (Tomato)",
            "2 bags × 400 = 800"
          ],
          [
            "Onion",
            "54 kg × 50 = 2700"
          ],
          [
            "Mashroom (Mushroom)",
            "20 pkt × 60 = 1200"
          ],
          [
            "Kothimeera (Coriander)",
            "30 pcs × 25 = 750"
          ],
          [
            "Pudeena (Mint)",
            "40 × 25 = 1000"
          ],
          [
            "Karivepak (Curry leaves)",
            "2 kg × 50 = 100"
          ],
          [
            "Hamali (loading)",
            "110"
          ]
        ],
        "balanceAfter": 10460.0,
        "date": "19 Aug 2026"
      }
    ]
  }
];

const fmt = n => "₹" + n.toLocaleString("en-IN");

const container = document.getElementById("cards");
data.forEach((cust, idx) => {
  const card = document.createElement("div");
  card.className = "card" + (idx === 0 ? " open" : "");

  const itemsHTML = t => t.items.length
    ? `<ul class="items">${t.items.map(([a,b]) => `<li><span>${a}</span><span>${b}</span></li>`).join("")}</ul>`
    : "";

  const txnHTML = cust.txns.map(t => `
    <div class="txn">
      <div class="txn-top">
        <div>
          <div class="txn-date">${t.date}</div>
          <div class="txn-title">${t.title}</div>
        </div>
        <div class="txn-amt ${t.type}">${t.type === "payment" ? "−" : "+"}${fmt(t.amount)}</div>
      </div>
      ${itemsHTML(t)}
      <div class="txn-bal">balance after: ${fmt(t.balanceAfter)}</div>
    </div>
  `).join("");

  card.innerHTML = `
    <div class="card-head">
      <div>
        <p class="card-name">${cust.name}</p>
        <p class="card-meta">${cust.txns.length} entries</p>
      </div>
      <div style="display:flex; align-items:center; gap:10px;">
        <div class="stamp ${cust.status === 'cleared' ? 'clear' : ''}">${cust.status === 'cleared' ? 'CLEARED' : 'PENDING'}</div>
        <div class="chevron"></div>
      </div>
    </div>
    <div class="card-totals">
      <div class="pill"><p class="pill-label">Billed</p><p class="pill-value">${fmt(cust.billed)}</p></div>
      <div class="pill"><p class="pill-label">Paid</p><p class="pill-value">${fmt(cust.paid)}</p></div>
      <div class="pill"><p class="pill-label">Due</p><p class="pill-value due">${fmt(cust.due)}</p></div>
    </div>
    <div class="card-body">${txnHTML}</div>
  `;

  card.querySelector(".card-head").addEventListener("click", () => {
    card.classList.toggle("open");
  });

  container.appendChild(card);
});
</script>

</body>
</html>
